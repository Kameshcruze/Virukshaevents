<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viruksha Events | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script src="main.js"></script>

<style>
:root{
  --primary:#0f3d2e;
  --secondary:#1f5f46;
  --accent:#4CAF50;
  --light:#f4fbf6;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--light);
  overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.header{
  position:fixed;
  width:100%;
  top:0;
  left:0;
  z-index:1000;
  transition:0.3s ease;
}

.nav{
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 8%;
}

.nav__logo a{
  color:#fff;
  font-weight:600;
  font-size:18px;
  text-decoration:none;
}

.nav__menu{
  display:flex;
}

.nav__list{
  display:flex;
  align-items:center;
  gap:30px;
  list-style:none;
}

.nav__link{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
}

.nav__link:hover,
.active-link{
  color:var(--accent);
}

.nav__btn{
  background:var(--accent);
  padding:8px 18px;
  border-radius:20px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  transition:0.3s;
}

.nav__btn:hover{
  background:#3a9c3f;
}

.nav__toggle{
  display:none;
  font-size:22px;
  color:#fff;
  cursor:pointer;
}

/* Scroll Effect */
.scroll-header{
  background:var(--primary);
}

/* ================= HERO ================= */

.hero{
  height:60vh;
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url("https://images.unsplash.com/photo-1519225421980-715cb0215aed") center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
}

.hero h1{
  font-size:40px;
  font-weight:600;
}

/* ================= FILTER ================= */

.filter-section{
  text-align:center;
  padding:60px 5% 20px;
}

.filter-btn{
  padding:8px 20px;
  margin:5px;
  border:none;
  cursor:pointer;
  background:var(--secondary);
  color:#fff;
  border-radius:20px;
  font-size:13px;
  transition:0.3s;
}

.filter-btn.active,
.filter-btn:hover{
  background:var(--accent);
}


.header{
  min-height: 250px !important;
}

@media (width > 768px){
  .header{
    min-height: 300px !important;
  }
}


/* ================= GALLERY ================= */

.gallery-container{
  column-count:3;
  column-gap:15px;
  padding:20px 8% 60px;
}

.gallery-item{
  margin-bottom:15px;
  overflow:hidden;
  border-radius:8px;
  cursor:pointer;
  position:relative;
}

.gallery-item img{
  width:100%;
  transition:0.4s ease;
  border-radius:8px;
}

.gallery-item:hover img{
  transform:scale(1.08);
}

/* ================= LIGHTBOX ================= */

.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.lightbox img{
  max-width:85%;
  max-height:85%;
  border-radius:8px;
}

.lightbox.active{
  display:flex;
}

/* ================= FOOTER ================= */

footer{
  background:var(--primary);
  color:#fff;
  text-align:center;
  padding:20px;
  font-size:13px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:992px){
  .gallery-container{
    column-count:2;
  }
}

@media(max-width:768px){

  .nav__menu{
    position:absolute;
    top:70px;
    right:-100%;
    width:220px;
    background:var(--primary);
    padding:20px;
    transition:0.3s ease;
  }

  .nav__menu.show-menu{
    right:0;
  }

  .nav__list{
    flex-direction:column;
    gap:20px;
  }

  .nav__toggle{
    display:block;
  }

  .gallery-container{
    column-count:1;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="header">
  <nav>
    <div class="nav__header">
      <div class="nav__logo">
        <a href="index.html">
          <img src="assets/logo-white.png" alt="logo" />
        </a>
      </div>
      <div class="nav__menu__btn" id="menu-btn">
        <i class="ri-menu-line"></i>
      </div>
    </div>

    <ul class="nav__links" id="nav-links">
      <li><a href="index.html#home">HOME</a></li>
      <li><a href="index.html#about">ABOUT US</a></li>
      <li><a href="index.html#service">SERVICES</a></li>

      <li class="nav__logo">
        <a href="index.html">
          <img src="assets/logo-white.png" alt="logo" />
        </a>
      </li>

      <li><a href="index.html#client">CLIENT</a></li>
      <li><a href="index.html#gallery">GALLERY</a></li>
      <li><a href="contact-us.html">CONTACT US</a></li>
    </ul>
    <!-- SOCIAL ICONS -->
  <div class="nav__socials">
    <a href="https://www.instagram.com/virukshaevents" target="_blank">
      <i class="ri-instagram-line"></i>
    </a>
    <a href="https://www.facebook.com/virukshaevents" target="_blank">
      <i class="ri-facebook-fill"></i>
    </a>
  </div>
  </nav>
</header>


<!-- ================= HERO ================= -->

<section class="hero">
  <h1>Our Portfolio</h1>
</section>

<!-- ================= FILTER ================= -->

<section class="filter-section">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="wedding">Weddings</button>
  <button class="filter-btn" data-filter="corporate">Corporate</button>
  <button class="filter-btn" data-filter="traditional">Traditional</button>
  <button class="filter-btn" data-filter="stage">Stage Decor</button>
</section>

<!-- ================= GALLERY ================= -->

<section class="gallery-container">

  <div class="gallery-item wedding">
    <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf" alt="">
  </div>

  <div class="gallery-item corporate">
    <img src="https://images.unsplash.com/photo-1503424886307-b090341d25d1" alt="">
  </div>

  <div class="gallery-item traditional">
    <img src="https://images.unsplash.com/photo-1542038784456-1ea8e935640e" alt="">
  </div>

  <div class="gallery-item stage">
    <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063" alt="">
  </div>

  <div class="gallery-item wedding">
    <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486" alt="">
  </div>

  <div class="gallery-item corporate">
    <img src="https://images.unsplash.com/photo-1515169067868-5387ec356754" alt="">
  </div>

</section>

<!-- ================= LIGHTBOX ================= -->

<div class="lightbox" id="lightbox">
  <img src="" alt="">
</div>

<footer>
  © 2026 Viruksha Events. All Rights Reserved.
</footer>

<!-- ================= JAVASCRIPT ================= -->

<script>

/* Toggle Mobile Menu */
const navMenu = document.getElementById("nav-menu");
const navToggle = document.getElementById("nav-toggle");

navToggle.addEventListener("click",()=>{
  navMenu.classList.toggle("show-menu");
});

/* Scroll Background */
window.addEventListener("scroll",()=>{
  const header = document.getElementById("header");
  if(window.scrollY >= 80){
    header.classList.add("scroll-header");
  }else{
    header.classList.remove("scroll-header");
  }
});

/* Filter Logic */
const filterBtns = document.querySelectorAll(".filter-btn");
const galleryItems = document.querySelectorAll(".gallery-item");

filterBtns.forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelector(".filter-btn.active").classList.remove("active");
    btn.classList.add("active");

    const filter = btn.dataset.filter;

    galleryItems.forEach(item=>{
      if(filter === "all" || item.classList.contains(filter)){
        item.style.display = "block";
      }else{
        item.style.display = "none";
      }
    });
  });
});

/* Lightbox */
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

galleryItems.forEach(item=>{
  item.addEventListener("click",()=>{
    lightbox.classList.add("active");
    lightboxImg.src = item.querySelector("img").src;
  });
});

lightbox.addEventListener("click",()=>{
  lightbox.classList.remove("active");
});

</script>

</body>
</html>
